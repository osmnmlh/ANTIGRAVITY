  <text x="360" y="140" font-size="11.5" text-anchor="middle" fill="#555">Tüm cihazlar aynı ölçüm biçimini konuşur. Sunucuya ulaşılamazsa her cihaz kendi yerleşik verisiyle çalışmaya devam eder.</text>
